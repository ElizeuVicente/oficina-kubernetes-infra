_format_version: "3.0"
services:
  - name: oficina-api
    url: http://host.docker.internal:8080
    routes:
      - name: api
        paths: ["/api"]
        strip_path: false
  - name: oficina-auth
    url: http://host.docker.internal:8081
    routes:
      - name: auth-cpf
        paths: ["/auth/cpf"]
        methods: ["POST"]
plugins:
  - name: rate-limiting
    config: { minute: 60, policy: local }
  - name: cors
    config:
      origins: ["http://localhost:3000"]
      methods: ["GET", "POST", "PATCH", "PUT", "DELETE", "OPTIONS"]
      headers: ["Authorization", "Content-Type", "X-Correlation-Id"]
      exposed_headers: ["X-Correlation-Id"]
      credentials: true
  - name: file-log
    config: { path: "/dev/stdout" }
