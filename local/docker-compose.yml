services:
  kong:
    image: kong:3.9
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/declarative/kong.yml
      KONG_PROXY_LISTEN: 0.0.0.0:8000
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
    ports: ["8000:8000", "8001:8001"]
    volumes: ["./kong.yml:/kong/declarative/kong.yml:ro"]
    extra_hosts: ["host.docker.internal:host-gateway"]
  prometheus:
    image: prom/prometheus:v3.2.1
    ports: ["9090:9090"]
    volumes: ["./prometheus.yml:/etc/prometheus/prometheus.yml:ro", "./alerts.yml:/etc/prometheus/alerts.yml:ro"]
    extra_hosts: ["host.docker.internal:host-gateway"]
  grafana:
    image: grafana/grafana:11.5.2
    ports: ["3000:3000"]
    volumes: ["grafana_data:/var/lib/grafana"]
  tempo:
    image: grafana/tempo:2.6.1
    command: ["-config.file=/etc/tempo.yml"]
    volumes: ["./tempo.yml:/etc/tempo.yml:ro"]
  otel-collector:
    image: otel/opentelemetry-collector:0.116.1
    command: ["--config=/etc/otelcol/config.yml"]
    ports: ["4318:4318"]
    volumes: ["./otel-collector.yml:/etc/otelcol/config.yml:ro"]
volumes:
  grafana_data:
