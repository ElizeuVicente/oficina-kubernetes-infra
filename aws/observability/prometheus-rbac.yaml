apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: oficina-prometheus-cadvisor
rules:
  - apiGroups: ['']
    resources: [nodes, nodes/proxy, nodes/metrics]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: oficina-prometheus-cadvisor
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: oficina-observability
roleRef:
  kind: ClusterRole
  name: oficina-prometheus-cadvisor
  apiGroup: rbac.authorization.k8s.io
