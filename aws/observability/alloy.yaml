apiVersion: v1
kind: ServiceAccount
metadata:
  name: alloy
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: oficina-alloy-logs
rules:
  - apiGroups: ['']
    resources: [pods, pods/log, namespaces]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: oficina-alloy-logs
subjects:
  - kind: ServiceAccount
    name: alloy
    namespace: oficina-observability
roleRef:
  kind: ClusterRole
  name: oficina-alloy-logs
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alloy
spec:
  replicas: 1
  selector:
    matchLabels: { app: alloy }
  template:
    metadata:
      labels: { app: alloy }
    spec:
      serviceAccountName: alloy
      containers:
        - name: alloy
          image: grafana/alloy:v1.10.2
          args: ["run", "/etc/alloy/config.alloy"]
          volumeMounts:
            - { name: config, mountPath: /etc/alloy, readOnly: true }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 200m, memory: 192Mi }
      volumes:
        - name: config
          configMap: { name: alloy-config }
