apiVersion: apps/v1
kind: Deployment
metadata:
  name: tempo
spec:
  replicas: 1
  selector:
    matchLabels: { app: tempo }
  template:
    metadata:
      labels: { app: tempo }
    spec:
      containers:
        - name: tempo
          image: grafana/tempo:2.8.2
          args: ["-config.file=/etc/tempo/tempo.yml"]
          ports:
            - { name: http, containerPort: 3200 }
            - { name: otlp, containerPort: 4318 }
          volumeMounts:
            - { name: config, mountPath: /etc/tempo, readOnly: true }
            - { name: data, mountPath: /var/tempo }
          resources:
            requests: { cpu: 75m, memory: 128Mi }
            limits: { cpu: 250m, memory: 384Mi }
      volumes:
        - name: config
          configMap: { name: tempo-config }
        - name: data
          emptyDir: { sizeLimit: 1Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: tempo
spec:
  selector: { app: tempo }
  ports:
    - { name: http, port: 3200, targetPort: http }
    - { name: otlp, port: 4318, targetPort: otlp }
