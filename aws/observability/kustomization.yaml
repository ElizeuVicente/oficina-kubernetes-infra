namespace: oficina-observability
resources:
  - namespace.yaml
  - prometheus.yaml
  - grafana.yaml
  - alertmanager.yaml
  - prometheus-rbac.yaml
  - loki.yaml
  - alloy.yaml
  - tempo.yaml
configMapGenerator:
  - name: prometheus-config
    files:
      - prometheus.yml
      - alerts.yml
  - name: grafana-dashboard
    files:
      - oficina.json
  - name: loki-config
    files:
      - loki.yml
  - name: alloy-config
    files:
      - config.alloy
  - name: tempo-config
    files:
      - tempo.yml
generatorOptions:
  disableNameSuffixHash: true
