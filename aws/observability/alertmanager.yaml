apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager
spec:
  replicas: 1
  selector:
    matchLabels: { app: alertmanager }
  template:
    metadata:
      labels: { app: alertmanager }
    spec:
      containers:
        - name: alertmanager
          image: prom/alertmanager:v0.27.0
          args: ["--config.file=/etc/alertmanager/alertmanager.yml"]
          ports:
            - { name: http, containerPort: 9093 }
          volumeMounts:
            - { name: config, mountPath: /etc/alertmanager, readOnly: true }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 150m, memory: 192Mi }
      volumes:
        - name: config
          secret: { secretName: alertmanager-config }
---
apiVersion: v1
kind: Service
metadata:
  name: alertmanager
spec:
  selector: { app: alertmanager }
  ports:
    - { name: http, port: 9093, targetPort: http }
